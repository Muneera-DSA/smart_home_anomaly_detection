name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: features, labels and event scoring (synthetic data)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  shap-crosscheck:
    name: TreeSHAP vs the shap package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install shap -e ".[dev]"
      - run: pytest -q tests/test_shap_library.py
